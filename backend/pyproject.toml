[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-agent-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # ADK — pin minor to avoid breaking pre-1.0 changes
    "google-adk>=1.0.0,<2.0.0",
    # LiteLLM for Mistral (and any future LLM swap)
    "litellm>=1.40.0,<2.0.0",
    # Scraping
    "crawl4ai>=0.4.0",
    "playwright>=1.51.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    # Search
    "ddgs>=6.0.0",
    "tavily-python>=0.3.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Scheduling
    "apscheduler>=3.10.0",
    # Logging
    "structlog>=24.2.0",
    # Utilities
    "tldextract>=5.1.0",
    "rapidfuzz>=3.9.0",
    "python-slugify>=8.0.0",
    "uuid-utils>=0.9.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
